<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>First Crew — Rideshare Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sand: #F5F2EB;
  --sand-dark: #EAE5D8;
  --ink: #1C1A17;
  --ink-mid: #4A4640;
  --ink-light: #8C8680;
  --dust: #D4CFC6;
  --driver-bg: #E8F0E4;
  --driver-fg: #2D5A1B;
  --train-bg: #E8E6F5;
  --train-fg: #3B347A;
  --avail-bg: #FDF0DC;
  --avail-fg: #7A5210;
  --self-bg: #E4EFF5;
  --self-fg: #1B4A5A;
  --full-bg: #F5E8E8;
  --full-fg: #7A1B1B;
  --accent: #C8964A;
  --accent-light: #F0E0C0;
  --radius: 10px;
  --radius-sm: 6px;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--sand);
  color: var(--ink);
  min-height: 100vh;
  padding: 0;
}

header {
  background: var(--ink);
  color: var(--sand);
  padding: 28px 40px 24px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
}

header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.1;
}

header p {
  font-size: 13px;
  color: #A09A90;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.btn {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.15s;
  text-decoration: none;
}
.btn:hover { opacity: 0.85; }
.btn-light { background: rgba(255,255,255,0.12); color: var(--sand); border-color: rgba(255,255,255,0.15); }

main { padding: 32px 40px 60px; max-width: 1100px; margin: 0 auto; }

.day-section { margin-bottom: 40px; }

.day-header-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
}

.day-date {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.day-note {
  font-size: 13px;
  color: var(--ink-light);
  margin-bottom: 16px;
  line-height: 1.5;
}

.vehicles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px;
  align-items: start;
}

.vehicle-card {
  background: #fff;
  border: 1px solid var(--dust);
  border-radius: var(--radius);
  padding: 16px;
}

.v-type {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 3px;
}

.v-label {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}

.v-route {
  font-size: 11px;
  color: var(--ink-light);
  background: var(--sand);
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  line-height: 1.4;
}

.person {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--sand-dark);
}
.person:last-child { border-bottom: none; }

.avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
  font-family: 'Space Grotesk', sans-serif;
}
.av-driver { background: var(--driver-bg); color: var(--driver-fg); }
.av-passenger { background: var(--sand-dark); color: var(--ink-mid); }
.av-available { background: var(--avail-bg); color: var(--avail-fg); }
.av-self { background: var(--self-bg); color: var(--self-fg); }
.av-train { background: var(--train-bg); color: var(--train-fg); }

.person-name { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.b-driver { background: var(--driver-bg); color: var(--driver-fg); }
.b-available { background: var(--avail-bg); color: var(--avail-fg); }
.b-self { background: var(--self-bg); color: var(--self-fg); }
.b-train { background: var(--train-bg); color: var(--train-fg); }

.divider {
  height: 1px;
  background: var(--dust);
  margin: 32px 0;
}

@media print {
  header { background: var(--ink) !important; -webkit-print-color-adjust: exact; }
  .header-actions { display: none !important; }
  .vehicle-card { break-inside: avoid; }
}

@media (max-width: 600px) {
  header { padding: 20px; flex-direction: column; align-items: flex-start; }
  main { padding: 20px 16px 40px; }
  .vehicles-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div>
    <h1>First Crew — Rideshare Plan</h1>
    <p>Elsewhere 2026 · June 2026</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-light" onclick="window.print()">🖨 print</button>
  </div>
</header>

<main id="main"></main>

<script>
const data = [
  {
    date:'Sunday 14 June', note:'Direct to site — early arrival.',
    vehicles: [
      { type:'Personal vehicle', label:"Ward's van", route:'→ site direct',
        people: [{name:'Ward',role:'driver'},{name:'Daniela',role:'passenger'}] },
      { type:'Personal vehicle', label:"Gabe's car", route:'→ site direct',
        people: [{name:'Gabe',role:'driver'},{name:'Javi',role:'passenger'}] },
      { type:'Own vehicle', label:'Dominik', route:'→ site direct',
        people: [{name:'Dominik',role:'driver'}] },
    ]
  },
  {
    date:'Monday 15 June',
    note:'Pick up Mad Max vans from Área Alquiler Barcelona → load at storage → drive to site. Zaragoza people carriers (6-seater + 9-seater) TBC — confirm driver(s) and timing in person.',
    vehicles: [
      { type:'Mad Max — Van 1', label:'Rental van', route:'BCN pickup → storage → Sariñena',
        people: [{name:'Cupcake',role:'driver'},{name:'Bo',role:'passenger'},{name:'Cayce',role:'passenger'}] },
      { type:'Mad Max — Van 2', label:'Rental van', route:'BCN pickup → storage → Sariñena',
        people: [{name:'Elli',role:'driver'},{name:'Ants',role:'passenger'},{name:'Charlie',role:'passenger'}] },
      { type:'Own vehicle', label:"Dov's van", route:'Madrid → Zaragoza → Sariñena',
        people: [{name:'Dov',role:'driver'},{name:'open seat',role:'available'},{name:'open seat',role:'available'}] },
      { type:'Train → station pickup', label:'Yllza', route:'Train to Sariñena — pickup at station. Bags in a van.',
        people: [{name:'Yllza',role:'train'}] },
      { type:'Self-arranged', label:'Zak', route:'→ arriving Monday, own arrangements',
        people: [{name:'Zak',role:'self'}] },
    ]
  },
  {
    date:'Tuesday 16 June', note:'',
    vehicles: [
      { type:'Own vehicle — full', label:"Vincenzo's van", route:'Barcelona → Sariñena',
        people: [{name:'Vincenzo',role:'driver'},{name:'Leanne',role:'passenger'},{name:'Rebar',role:'passenger'}] },
      { type:'Self-arranged', label:'Ian Salter', route:'Valencia → Lleida (hotel Mon night) → Sariñena by bicycle + train',
        people: [{name:'Ian Salter',role:'self'}] },
    ]
  }
];

const ROLE_BADGE = {
  driver: '<span class="badge b-driver">driver</span>',
  available: '<span class="badge b-available">available</span>',
  self: '<span class="badge b-self">self</span>',
  train: '<span class="badge b-train">train</span>',
  passenger: '',
};
const ROLE_AV = {
  driver: 'av-driver', passenger: 'av-passenger', available: 'av-available',
  self: 'av-self', train: 'av-train',
};

function initials(name) {
  if (!name || name === 'open seat') return '?';
  return name.trim().split(' ').map(w => w[0] || '').join('').slice(0,2).toUpperCase();
}

document.getElementById('main').innerHTML = data.map((day, di) => `
  <div class="day-section">
    <div class="day-header-row">
      <span class="day-date">${day.date}</span>
    </div>
    ${day.note ? `<p class="day-note">${day.note}</p>` : ''}
    <div class="vehicles-grid">
      ${day.vehicles.map(v => `
        <div class="vehicle-card">
          <p class="v-type">${v.type}</p>
          <p class="v-label">${v.label}</p>
          <p class="v-route">${v.route}</p>
          <div>
            ${v.people.map(p => `
              <div class="person">
                <div class="avatar ${ROLE_AV[p.role] || 'av-passenger'}">${initials(p.name)}</div>
                <span class="person-name">${p.name}</span>
                ${ROLE_BADGE[p.role] || ''}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  </div>
  ${di < data.length - 1 ? '<div class="divider"></div>' : ''}
`).join('');
</script>
</body>
</html>
