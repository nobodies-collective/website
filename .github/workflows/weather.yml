name: Update weather tracker

on:
  schedule:
    # 06:30 and 12:30 Europe/Madrid (CEST) — morning entry + post-noon refresh
    - cron: '30 4,10 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AEMET warnings
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python3 scripts/fetch-weather.py

      - name: Commit and push if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather-auto.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weather tracker data (auto)"
            git push
          fi
